name: DSHMobile
options:
  bundleIdPrefix: com.fangchen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources:
      - path: DSHMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fangchen.dsh-mobile
        PRODUCT_NAME: DSH Mobile
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DSHMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - DSHMobileTests
  DSHMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHMobileTests
    dependencies:
      - target: DSHMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fangchen.dsh-mobile.tests
