name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          ./build.sh
          ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: .build/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./windows/package.ps1 -RuntimeIdentifier "${{ matrix.runtime }}" -Version $version
      - name: Smoke test Windows x64 app
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $app = Resolve-Path ".build/windows/win-x64/DSH Desktop.exe"
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "DSH Desktop exited during the Windows smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: .build/dist-windows/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Decode Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Test and build signed Android app
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          export VERSION_NAME
          ./android/gradlew --no-daemon -p android testDebugUnitTest lintDebug assembleRelease
          mkdir -p .build/dist-android
          cp android/app/build/outputs/apk/release/app-release.apk ".build/dist-android/DSH-Mobile-Android-${VERSION_NAME}.apk"
          cd .build/dist-android
          sha256sum *.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: .build/dist-android/*
          if-no-files-found: error

  publish:
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "DSH Desktop $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
