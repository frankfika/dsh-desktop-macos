name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native iOS client
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for devices in data.values() for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          xcodebuild -project ios/DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and build native Android client
        run: ./android/build_and_verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Mobile-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata
        run: plutil -lint Info.plist
      - name: Build universal app
        run: ./build.sh
      - name: Package release artifacts
        run: ./scripts/package.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-universal
          path: .build/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Windows project
        run: dotnet restore windows/DSHDesktop.Windows.csproj
      - name: Publish portable Windows build
        shell: pwsh
        run: ./windows/package.ps1 -RuntimeIdentifier "${{ matrix.runtime }}" -Version "1.2.0"
      - name: Smoke test Windows x64 app
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $app = Resolve-Path ".build/windows/win-x64/DSH Desktop.exe"
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "DSH Desktop exited during the Windows smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-Windows-${{ matrix.runtime }}
          path: .build/dist-windows/*
          if-no-files-found: error
